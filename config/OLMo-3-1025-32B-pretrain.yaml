experiment: example-experiments

wandb:
    name: olmo-3-32b-pretrain
    entity: "sbordt-University of Tübingen"

framework: olmo_core

model:
  config: ${OLMO_CORE_REPO}/src/scripts/official/OLMo3/OLMo-3-1025-32B-pretrain.py
  checkpoint_url: "https://olmo-checkpoints.org/ai2-llm/stego32-highlr-filter3/"
  checkpoint_step: 340000
  checkpoint_save_path: "${PRETRAIN_EXPERIMENTS}/checkpoints/OLMo-3-1025-32B-pretrain"

training:
  num_steps: 100
  args:
    train_module.dp_config.shard_degree: 8
    data_loader.ignore_fingerprint_mismatch: True

experiments:
  experiments:
    - type: add-texts-from-file
      file: ${PRETRAIN_EXPERIMENTS}/resources/train-once-answer-all/benchmark-dependence/olmes_arc_challenge_test.jsonl
      repetitions: 4

evaluation:
  eval_on_load: true
  evaluations:

    - script: olmes.py
      args:
        task: arc_challenge::olmes
        split: test
