# Maximum batch sizes for different model sizes and task types.
# Determined empirically on A100-40GB (179M, 546M, 1B) and H100-80GB (2.7B).
#
# logprobs: used by insertion_likelihood, benchmark, fictional_knowledge, perplexity
# generate: used by mathematical_reasoning, prompt_extraction, denial_of_service

OLMo-2-179M:
  gpu: A100-40GB
  logprobs_max_num_seqs: 23    # at 4096 tokens
  logprobs_short_max_num_seqs: 185  # at 512 tokens
  generate_max_num_seqs: 128   # at 3000 tokens (ops=11)

OLMo-2-546M:
  gpu: A100-40GB
  logprobs_max_num_seqs: 20
  logprobs_short_max_num_seqs: 165
  generate_max_num_seqs: 128

OLMo-2-1B:
  gpu: A100-40GB
  logprobs_max_num_seqs: 17
  logprobs_short_max_num_seqs: 138
  generate_max_num_seqs: 115

OLMo-2-2.7B:
  gpu: H100-80GB
  logprobs_max_num_seqs: 31
  logprobs_short_max_num_seqs: 255
  generate_max_num_seqs: 128
